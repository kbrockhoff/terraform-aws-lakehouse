name: Terraform CI

on:
  push:
    branches: [ main, feature/*, bugfix/*, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  # upload-sarif reads the workflow run; unlisted scopes default to none
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        terraform_version: ["1.11.4", "latest"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ matrix.terraform_version }}

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: v0.64.0

    - name: Setup terraform-docs
      run: go install github.com/terraform-docs/terraform-docs@v0.24.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Setup Checkov
      run: |
        python -m pip install --upgrade pip
        pip install checkov

    # The same gates as local validation (principles: Validate Before Merge)
    - name: Format and validate
      run: make check

    - name: Lint
      run: make lint

    - name: Documentation is current
      run: |
        make docs
        git diff --exit-code -- '*.md'

    # The scan runs on every matrix leg; the SARIF report comes from the latest leg only
    - name: Security scan
      if: matrix.terraform_version != 'latest'
      run: make security-scan

    - name: Security scan with SARIF report
      if: matrix.terraform_version == 'latest'
      run: make security-scan CHECKOV_ARGS="--output sarif --output-file-path console,checkov-report.sarif"

    # Checkov reports inline checkov:skip results as SARIF suppressions, which code scanning
    # ignores and raises as alerts; the justified skip in source is the decision of record
    - name: Drop suppressed results from SARIF report
      if: always() && matrix.terraform_version == 'latest' && hashFiles('checkov-report.sarif') != ''
      run: |
        jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' checkov-report.sarif > checkov-report.filtered.sarif
        mv checkov-report.filtered.sarif checkov-report.sarif

    # Fork PRs get a read-only security-events token, so skip the upload there
    - name: Upload Checkov SARIF results
      if: always() && matrix.terraform_version == 'latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: checkov-report.sarif
        category: checkov

  terraform-tests:
    name: Terraform Tests
    runs-on: ubuntu-latest
    environment: development
    needs: terraform-checks
    strategy:
      matrix:
        terraform_version: ["1.11.4", "latest"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: terraform-ci-tests
        aws-region: us-east-1
        audience: sts.amazonaws.com
        retry-max-attempts: 3
        output-credentials: true


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ matrix.terraform_version }}

    - name: Plan-only contract tests
      run: make test
