  # ---------------------------------------------------------------- FR-017
  - key: reader_cols
    cases:
      - id: rc-schema
        op: get_table
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_columns: [order_id, region, amount, attrs, order_date]
        rule: GetTable returns only the columns the caller may see
      - id: rc-permitted-columns
        op: select_columns
        resource: { tenant: alpha, table: orders, columns: [order_id, region, amount] }
        expect: allowed
        expect_rows: { count: 200 }
        rule: Column-restricted SELECT returns every row of the permitted columns
      - id: rc-restricted-column
        op: select_columns
        resource: { tenant: alpha, table: orders, columns: [ssn] }
        expect: denied
        rule: Excluded columns cannot be queried
      - id: rc-select-star
        op: select
        resource: { tenant: alpha, table: orders }
        expect: absent
        absent_columns: [ssn]
        rule: SELECT * omits excluded columns
      - id: rc-customers
        op: count
        resource: { tenant: alpha, table: customers }
        expect: allowed
        expect_rows: { count: 50 }
        rule: Unrestricted tables stay fully readable
      - id: rc-select-gamma
        op: select
        resource: { tenant: gamma, table: orders }
        expect: denied
        rule: FR-014 - no access to ungranted namespaces
      - id: rc-select-gamma-lf
        style: label
        op: select
        resource: { tenant: gamma, table: orders, via: named }
        expect: denied
        denied_by: lake_formation
        rule: FR-014 - Lake Formation, not only IAM, refuses ungranted namespaces
        note: the named baseline workgroup lets the query reach Lake Formation (plan.md D22, awslkhs-ptos)
      - id: rc-storage-bypass
        op: storage_read
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: FR-022
      - id: rc-relabel-column
        style: label
        phase: scenario
        setup: relabel_column_restricted
        op: get_table
        resource: { tenant: alpha, table: orders }
        expect: absent
        absent_columns: [amount]
        rule: Relabeling a column restricted hides it from readers without that level
      - id: rc-relabel-column-restored
        style: label
        phase: scenario
        op: get_table
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_columns: [order_id, region, amount, attrs, order_date]
        rule: Restoring the label returns the column
      - id: rc-relabel-table
        style: label
        phase: scenario
        setup: relabel_table_restricted
        op: count
        resource: { tenant: alpha, table: customers }
        expect: denied
        rule: FR-023 - access follows labels; a table moved above the reader's levels is hidden
      - id: rc-relabel-table-restored
        style: label
        phase: scenario
        op: count
        resource: { tenant: alpha, table: customers }
        expect: allowed
        expect_rows: { count: 50 }
        rule: FR-023 - restoring the label restores access

  # ---------------------------------------------------------------- FR-018
  - key: reader_rows
    cases:
      - id: rr-count-union
        op: count
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_rows: { count: 150 }
        rule: Several row filters for one principal combine as a union (EU 80 + US 70)
        note: label style failed before the awslkhs-fysh fix (the reader's tag grant covered all rows)
      - id: rr-rows-match
        op: select
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_rows: { count: 150 }
        row_predicate: { column: region, op: in, values: [EU, US] }
        rule: Row filters return only matching rows
      - id: rr-other-namespace
        op: count
        resource: { tenant: beta, table: orders }
        expect: denied
        rule: Row filters grant only their table
      - id: rr-select-gamma
        op: select
        resource: { tenant: gamma, table: orders }
        expect: denied
        rule: FR-014 - no access to ungranted namespaces
      - id: rr-select-gamma-lf
        style: label
        op: select
        resource: { tenant: gamma, table: orders, via: named }
        expect: denied
        denied_by: lake_formation
        rule: FR-014 - Lake Formation, not only IAM, refuses ungranted namespaces
        note: the named baseline workgroup lets the query reach Lake Formation (plan.md D22, awslkhs-ptos)
      - id: rr-storage-bypass
        op: storage_read
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: FR-022
      - id: rr-all-rows
        phase: scenario
        setup: all_rows_filter
        op: count
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_rows: { count: 200 }
        rule: An all-rows filter prevails over predicate filters

  # ---------------------------------------------------------------- FR-019
  - key: reader_cells
    cases:
      - id: rce-count
        op: count
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_rows: { count: 80 }
        rule: Cell filters restrict rows (EU 80)
        note: label style failed before the awslkhs-fysh fix
      - id: rce-schema
        op: get_table
        resource: { tenant: alpha, table: orders }
        expect: allowed
        expect_columns: [order_id, region, amount, attrs, order_date]
        rule: Cell filters restrict columns
      - id: rce-cells
        op: select
        resource: { tenant: alpha, table: orders }
        expect: allowed
        absent_columns: [ssn]
        row_predicate: { column: region, op: eq, values: [EU] }
        rule: Only permitted cells are returned
      - id: rce-restricted-column
        op: select_columns
        resource: { tenant: alpha, table: orders, columns: [ssn] }
        expect: denied
        rule: Excluded columns cannot be queried
      - id: rce-select-gamma
        op: select
        resource: { tenant: gamma, table: orders }
        expect: denied
        rule: FR-014 - no access to ungranted namespaces
      - id: rce-select-gamma-lf
        style: label
        op: select
        resource: { tenant: gamma, table: orders, via: named }
        expect: denied
        denied_by: lake_formation
        rule: FR-014 - Lake Formation, not only IAM, refuses ungranted namespaces
        note: the named baseline workgroup lets the query reach Lake Formation (plan.md D22, awslkhs-ptos)
      - id: rce-storage-bypass
        op: storage_read
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: FR-022

  # ---------------------------------------------------------------- FR-020
  - key: control
    cases:
      - id: ctl-list-databases
        op: list_databases
        resource: { tenant: alpha }
        expect: absent
        rule: A principal with no grants sees no fixture namespaces
      - id: ctl-get-table
        op: get_table
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: No grants, no metadata
      - id: ctl-select
        op: select
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: No grants, no data
      - id: ctl-count-beta
        op: count
        resource: { tenant: beta, table: orders }
        expect: denied
        rule: No grants, no data
      - id: ctl-list-permissions
        op: list_permissions
        expect: denied
        rule: Only administrators list permissions
      - id: ctl-storage-bypass
        op: storage_read
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: FR-022
      - id: ctl-insert
        phase: scenario
        op: insert
        resource: { tenant: alpha, table: customers }
        expect: denied
        rule: No grants, no writes

  # ---------------------------------------------- spec 003 FR-020 cases 1 and 2
  # Holds s3tables:* and S3 object access on table storage and a reader's Athena and Glue access,
  # but no Lake Formation grant. Only the table-bucket deny stops its direct calls (FR-015).
  # Label style only: the deny is on the module's zone buckets, not the named baseline bucket.
  - key: bypass
    cases:
      - id: bypass-storage-read
        style: label
        op: storage_read
        resource: { tenant: alpha, table: orders }
        expect: denied
        rule: spec 003 FR-015 - the table-bucket deny refuses direct reads despite IAM access
      - id: bypass-storage-write
        style: label
        op: storage_write
        resource: { tenant: alpha, table: scratch }
        expect: denied
        rule: spec 003 FR-015 - the table-bucket deny refuses direct writes despite IAM access
      - id: bypass-select
        style: label
        op: select
        resource: { tenant: alpha, table: orders }
        expect: denied
        denied_by: lake_formation
        rule: spec 003 FR-020 case 2 - no Lake Formation grant, no governed access

  # ---------------------------------------------- spec 003 FR-020 cases 6 to 10
  # A persona in the consumer account (make ... CONSUMER_PROFILE=...). The producer shares tenant
  # alpha's curated namespace, public and internal labels, read-only; the consumer's admin grants
  # this persona by LF-tag expression through a resource link (tenant: consumer). Row-filtered
  # tables (orders at stage 2) are never shared. Skipped without a consumer account.
  - key: consumer
    requires: consumer
    cases:
      - id: consumer-count-shared
        style: label
        op: count
        resource: { tenant: consumer, table: customers }
        expect: allowed
        expect_rows: { count: 50 }
        rule: spec 003 FR-021 - shared, label-matching tables are readable in the consumer
      - id: consumer-orders-not-shared
        style: label
        op: get_table
        resource: { tenant: consumer, table: orders }
        expect: denied
        rule: spec 003 FR-024 - row-filtered tables are excluded from shares
      - id: consumer-select-orders
        style: label
        op: select
        resource: { tenant: consumer, table: orders }
        expect: denied
        rule: spec 003 FR-024 - row filters are not shared, so the table is not either
      - id: consumer-other-tenant
        style: label
        op: get_database
        resource: { tenant: beta }
        expect: denied
        rule: spec 003 FR-023 - every share is bounded by the tenant tag
      - id: consumer-other-zone
        style: label
        op: get_database
        resource: { tenant: alpha, zone: raw }
        expect: denied
        rule: spec 003 FR-023 - only the shared zones are visible
      - id: consumer-storage-bypass
        style: label
        op: storage_read
        resource: { tenant: alpha, table: customers }
        expect: denied
        rule: spec 003 FR-015 - consumers read only through credentials the producer vends
      - id: consumer-insert
        style: label
        phase: scenario
        op: insert
        resource: { tenant: consumer, table: customers }
        expect: denied
        rule: spec 003 FR-024 - shares are read-only
      - id: consumer-drop
        style: label
        phase: scenario
        op: drop_table
        resource: { tenant: consumer, table: scratch }
        expect: denied
        rule: spec 003 FR-024 - shares are read-only
      - id: consumer-revoked
        style: label
        phase: scenario
        setup: revoke_share
        op: count
        resource: { tenant: consumer, table: customers }
        expect: denied
        rule: spec 003 FR-025 - removing a share revokes consumer access

